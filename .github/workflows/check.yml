name: Status check
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: status, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: data }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run checks
        run: node check.mjs
        env:
          STATUS_TARGETS: ${{ secrets.STATUS_TARGETS }}
          STATUS_INGEST_URL: ${{ secrets.STATUS_INGEST_URL }}
          STATUS_INGEST_TOKEN: ${{ secrets.STATUS_INGEST_TOKEN }}
      - name: Publish results
        working-directory: data
        run: |
          git config user.name "restowise-status"
          git config user.email "status@restowise.app"
          git add -A
          git commit -qm "check $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
